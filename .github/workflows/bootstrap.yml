name: Bootstrap MnemoFlux source
on:
  push:
    branches: [main]
    paths: ['source.tar.gz.b64']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore source
        run: |
          base64 -d source.tar.gz.b64 | tar xz
          rm source.tar.gz.b64
          git rm --cached -q source.tar.gz.b64
          git rm -q .github/workflows/bootstrap.yml
      - name: Commit full source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish MnemoFlux learning app"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
