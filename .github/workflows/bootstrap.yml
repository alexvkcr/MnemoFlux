name: Bootstrap MnemoFlux source
on:
  push:
    branches: [main]
    paths: ['source.tar.gz.b64']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore project source
        run: |
          cat source.part.* | base64 -d | tar xz
          rm -f source.part.* source.tar.gz.b64 .github/workflows/catalog-issue.yml .github/workflows/deploy.yml
          git rm -q source.part.* source.tar.gz.b64
      - name: Commit project source without workflow updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish MnemoFlux learning application"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
