name: Publicar cambios de vocabulario
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: catalog-deployment
  cancel-in-progress: false
jobs:
  update:
    if: >-
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, 'catalog:') &&
      (
        (github.event.action == 'opened' && github.event.issue.user.login == github.repository_owner) ||
        (github.event.action == 'labeled' && github.event.label.name == 'catalog:approved' && github.event.sender.login == github.repository_owner)
      )
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - id: update
        uses: actions/github-script@v7
        with:
          script: |
            const {processCatalogIssue}=await import(`${process.env.GITHUB_WORKSPACE}/scripts/catalog-issue.mjs`);
            try {
              await processCatalogIssue({github,context,core});
            } catch (error) {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'❌ Propuesta no publicada: '+String(error.message||error).slice(0,1000)});
              throw error;
            }
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
